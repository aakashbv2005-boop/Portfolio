</header>

<main>
  <section class="page-head container">
    <p class="eyebrow glass"><span class="pulse"></span> LET'S TALK</p>
    <h1 class="page-title reveal">Contact</h1>
    <p class="page-lede reveal">
      Open to internships and roles in industrial automation, robotics and smart
      manufacturing. Send a message or reach out directly.
    </p>
  </section>

  <section class="section container" style="padding-top:0">
    <div class="contact-card glass reveal">
      <form class="contact-form" id="contactForm">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field field-wide">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <p class="form-note" id="formNote" role="status"></p>
      </form>

      <div class="contact-links">
        <a href="mailto:your.email@example.com">Email</a>
        <a href="https://linkedin.com/in/your-profile" target="_blank" rel="noopener">LinkedIn</a>
        <a href="assets/resume.pdf">Download Resume</a>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <span>© <span id="year"></span> Aakash Babu Naventran</span>
    <span>Coimbatore, India</span>
